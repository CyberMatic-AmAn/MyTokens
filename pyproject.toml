[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mytokens"
version = "0.1.0"
description = "A lightweight, production-grade, zero-dependency rule-based NLP tokenizer library for Python."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "MyTokens Contributors" }
]
keywords = [
    "tokenizer",
    "tokenization",
    "nlp",
    "natural-language-processing",
    "lexical-analysis",
    "text-processing",
    "unicode"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed"
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "build>=1.0.0",
    "twine>=4.0.0"
]
benchmark = [
    "nltk>=3.8.0"
]

[project.urls]
Homepage = "https://github.com/mytokens/mytokens"
Repository = "https://github.com/mytokens/mytokens"
Documentation = "https://github.com/mytokens/mytokens#readme"
"Bug Tracker" = "https://github.com/mytokens/mytokens/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mytokens = ["py.typed"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.ruff]
target-version = "py310"
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = []
